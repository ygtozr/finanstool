name: Publish approved v9.0.5 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish v9.0.5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "9.0.5" || exit 0
          previous_tag=5078dbe0dc78cf2ef363c9e9dc70e7d736a96e5c
          archive_sha=$(gh api "repos/$GH_REPO/git/ref/heads/archive/v9.0.4-before-ios-v9.0.5" --jq '.object.sha')
          test "$archive_sha" = "$previous_tag"
          old_tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v9.0.4" --jq '.object.sha')
          test "$old_tag_sha" = "$previous_tag"
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v9.0.5" --jq '.object.sha' 2>/dev/null) || tag_sha=''
          if test -n "$tag_sha"; then
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          if gh release view v9.0.5 >/dev/null 2>&1; then
            release_target=$(gh api "repos/$GH_REPO/releases/tags/v9.0.5" --jq '.target_commitish')
            test "$release_target" = "$GITHUB_SHA"
            gh release edit v9.0.5 --title "Özer Finans v9.0.5" --notes-file RELEASE_NOTES_v9.0.5.md --latest
          else
            gh release create v9.0.5 --target "$GITHUB_SHA" --title "Özer Finans v9.0.5" --notes-file RELEASE_NOTES_v9.0.5.md --latest
          fi
