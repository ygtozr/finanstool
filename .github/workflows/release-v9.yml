name: Publish approved v9.0.2 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v9.0.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "9.0.2" || exit 0
          if gh release view v9.0.2 >/dev/null 2>&1; then
            echo "v9.0.2 already exists; keep its original tag."
          else
            gh release create v9.0.2 --target "$GITHUB_SHA" --title "Özer Finans v9.0.2" --notes-file RELEASE_NOTES_v9.0.2.md --latest
          fi
