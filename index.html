        const used=new Set(compareData.map(item=>item.color));
        const color=comparisonColors.find(item=>!used.has(item))||comparisonColors[compareData.length%comparisonColors.length];
        compareData.push({rawSymbol:symbol,currency:String(result.meta?.currency||'USD').toUpperCase(),rawValues:alignResultToLabels(result,primaryLabels),values:[],color});
        await refreshComparisons();
      }catch(error){
        alert('Karşılaştırma verisi alınamadı: '+error.message);
      }finally{
        comparisonRequests.delete(symbol);
        updateFavoriteCompareButtons();
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      loadPrice(symbolInput.value.trim().toUpperCase());
    });
    function showSuggestions(items){
      suggestions.replaceChildren();
      items.slice(0,5).forEach((item,index)=>{
        const li=document.createElement('li'),button=document.createElement('button');
        button.type='button';button.className='suggestion';button.textContent=item.symbol+' · '+item.name;
        prepareSuggestionButton(button,suggestions,index);
        button.addEventListener('click',()=>{symbolInput.value=item.symbol;updateComboboxState(symbolInput,suggestions,false);updateFavoriteButton();updateCompareButton();loadPrice(item.symbol)});
        li.append(button);suggestions.append(li);
      });
      updateComboboxState(symbolInput,suggestions,items.length>0);
    }
    symbolInput.addEventListener('input',()=>{
      const requestId=++searchRequestId;
      updateFavoriteButton();updateCompareButton();clearTimeout(searchTimer);
      const query=symbolInput.value.trim();
      if(query.length<2)return showSuggestions([]);
      searchTimer=setTimeout(async()=>{
        try{
          const payload=await cachedApiJson('/api/search?q='+encodeURIComponent(query),{ttl:60000});
          if(requestId!==searchRequestId||symbolInput.value.trim()!==query)return;
          showSuggestions(payload.quotes||[]);
        }catch{if(requestId===searchRequestId)showSuggestions([])}
      },250);
    });
    favoriteButton.addEventListener('click', () => { const symbol=currentSymbol(); if (!symbol) return symbolInput.focus(); if (isFavorite(symbol)) { favorites=favorites.filter(item=>item.symbol!==symbol); favoriteQuotes.delete(symbol); } else favorites.push({symbol,name:currentName||symbol}); saveFavorites(); renderFavorites(); updateFavoriteButton(); refreshFavoriteQuotes(); });
    periodButtons.forEach(periodButton => periodButton.addEventListener('click', () => {
      selectedRange = periodButton.dataset.range;
      selectedStart = '';
      datePicker.classList.remove('visible');
      customPeriod.textContent = 'Şu tarihten itibaren';
      dateError.textContent = '';
      setActivePeriod(periodButton);
      loadPrice(symbolInput.value.trim().toUpperCase());
    }));
    customPeriod.addEventListener('click', () => {
      datePicker.classList.add('visible');
      startDate.focus();
    });
    startDate.addEventListener('input', () => { startDate.value = tidyDate(startDate.value); });
    startDate.addEventListener('change', applyStartDate);
    startDate.addEventListener('keydown', event => { if (event.key === 'Enter') applyStartDate(); });



    enableComboboxKeyboard(symbolInput,suggestions);
    enableComboboxKeyboard(marketSettingsSearch,marketSettingsSuggestions);
    enableComboboxKeyboard(benchmarkSearch,benchmarkSuggestions);
    enableComboboxKeyboard(portfolioSymbol,portfolioSuggestions);

    const manualRefreshMarketAndFavorites=()=>{apiCache.clear();return refreshMarketAndFavorites()};
    marketRefresh.addEventListener('click',manualRefreshMarketAndFavorites);
    favoriteRefresh.addEventListener('click',manualRefreshMarketAndFavorites);
    marketSettingsButton.addEventListener('click',()=>{renderMarketSettings();marketSettingsDialog.showModal();marketSettingsSearch.focus()});
    marketSettingsClose.addEventListener('click',()=>marketSettingsDialog.close());
    marketSettingsSearch.addEventListener('input',()=>{
      const requestId=++marketSearchRequestId;
      clearTimeout(marketSearchTimer);
      const query=marketSettingsSearch.value.trim();
      if(query.length<2)return showMarketSuggestions([]);
      marketSearchTimer=setTimeout(async()=>{
        try{
          const payload=await cachedApiJson('/api/search?q='+encodeURIComponent(query),{ttl:60000});
          if(requestId!==marketSearchRequestId||marketSettingsSearch.value.trim()!==query)return;
          showMarketSuggestions(payload.quotes||[]);
        }catch{if(requestId===marketSearchRequestId)showMarketSuggestions([])}
      },250);
    });
    marketSettingsForm.addEventListener('submit',event=>{
      event.preventDefault();
      if(marketSearchResults.length)return addMarketItem(marketSearchResults[0]);
      const symbol=marketSettingsSearch.value.trim().toUpperCase();
      if(symbol)addMarketItem({symbol,name:symbol});
    });
    dataButton.addEventListener('click',()=>{
      pendingRestoreData=null;
      backupFile.value='';
      backupError.textContent='';
      backupPreview.textContent='Henüz bir yedek dosyası seçilmedi.';
      backupPreview.classList.remove('success');
      restoreBackup.disabled=true;
      dataDialog.showModal();
    });
    dataClose.addEventListener('click',()=>dataDialog.close());
    backupDownload.addEventListener('click',()=>{
      const backup=createBackup();
      const day=new Date().toISOString().slice(0,10);
      downloadBlob(new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'}),'finans-grafigi-yedek-'+day+'.json');
    });
    backupFile.addEventListener('change',async()=>{
      pendingRestoreData=null;
      restoreBackup.disabled=true;
      backupError.textContent='';
      backupPreview.classList.remove('success');
      const file=backupFile.files?.[0];
      if(!file){backupPreview.textContent='Henüz bir yedek dosyası seçilmedi.';return}
      if(file.size>1024*1024){backupPreview.textContent='Dosya okunamadı.';backupError.textContent='Yedek dosyası 1 MB sınırını aşıyor.';return}
      try{
        pendingRestoreData=normalizeBackup(JSON.parse(await file.text()));
        backupPreview.textContent=backupSummary(pendingRestoreData);
        restoreBackup.disabled=false;
      }catch(error){
        backupPreview.textContent='Dosya doğrulanamadı.';
        backupError.textContent=error.message||'Geçersiz JSON dosyası.';
      }
    });
    restoreBackup.addEventListener('click',()=>{
      if(!pendingRestoreData)return;
      applyBackup(pendingRestoreData,restoreMode.value);
      backupPreview.textContent='Geri yükleme tamamlandı.\n'+backupSummary(pendingRestoreData);
      backupPreview.classList.add('success');
      backupError.textContent='';
      restoreBackup.disabled=true;
      pendingRestoreData=null;
    });
    themeToggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
    exportCsv.addEventListener('click',exportChartCsv);
    exportPng.addEventListener('click',exportChartPng);
    advancedSearchButton.addEventListener('click',()=>{advancedQuery.value=symbolInput.value;advancedResults.replaceChildren();advancedSearchDialog.showModal();advancedQuery.focus()});
    advancedClose.addEventListener('click',()=>advancedSearchDialog.close());
    advancedSearchForm.addEventListener('submit',async event=>{
      event.preventDefault();
      advancedResults.textContent='Aranıyor…';
      try{
        const payload=await cachedApiJson('/api/search?q='+encodeURIComponent(advancedQuery.value.trim())+'&advanced=1',{ttl:60000});
        let items=payload.quotes||[];
        if(advancedMarket.value==='bist')items=items.filter(item=>item.symbol.endsWith('.IS'));
        if(advancedMarket.value==='us')items=items.filter(item=>!item.symbol.includes('.')||['NYSE','NasdaqGS','NasdaqCM','NasdaqGM','NYSEArca'].includes(item.exchange));
        if(advancedType.value!=='all')items=items.filter(item=>item.type===advancedType.value);
        renderAdvancedResults(items);
      }catch{renderAdvancedResults([])}
    });
    alarmButton.addEventListener('click',()=>{alarmSymbol.value=currentSymbol();alarmTarget.value='';renderAlarms();alarmDialog.showModal()});
    alarmClose.addEventListener('click',()=>alarmDialog.close());
    alarmForm.addEventListener('submit',async event=>{
      event.preventDefault();
      const symbol=alarmSymbol.value.trim().toUpperCase();
      const target=Number(alarmTarget.value);
      if(!symbol||!Number.isFinite(target)||target<=0)return;
      alarms.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),symbol,target,condition:alarmCondition.value,triggered:false});
      saveAlarms();
      renderAlarms();
      alarmTarget.value='';
      if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
      checkAlarms();
    });
    benchmarkPresetButtons.forEach(button=>button.addEventListener('click',()=>{
      benchmarkSettings={...benchmarkSettings,symbol:button.dataset.benchmarkSymbol,name:button.dataset.benchmarkName};
      benchmarkSelection=null;
      saveBenchmarkSettings();
      renderPortfolioBenchmark();
    }));
    benchmarkRangeButtons.forEach(button=>button.addEventListener('click',()=>{
      benchmarkSettings={...benchmarkSettings,range:button.dataset.benchmarkRange};
      saveBenchmarkSettings();
      renderPortfolioBenchmark();
    }));
    benchmarkSearch.addEventListener('input',()=>{
      const requestId=++benchmarkSearchRequestId;
      benchmarkSelection=null;
      clearTimeout(benchmarkSearchTimer);
      const query=benchmarkSearch.value.trim();
      if(query.length<2)return showBenchmarkSuggestions([]);
      benchmarkSearchTimer=setTimeout(async()=>{
        try{
          const payload=await cachedApiJson('/api/search?q='+encodeURIComponent(query),{ttl:60000});
          if(requestId!==benchmarkSearchRequestId||benchmarkSearch.value.trim()!==query)return;
          showBenchmarkSuggestions(payload.quotes||[]);
        }catch{if(requestId===benchmarkSearchRequestId)showBenchmarkSuggestions([])}
      },250);
    });
    benchmarkApply.addEventListener('click',()=>{
      const symbol=String(benchmarkSelection?.symbol||benchmarkSearch.value).trim().toUpperCase();
      if(!symbol)return benchmarkSearch.focus();
      benchmarkSettings={...benchmarkSettings,symbol,name:benchmarkSelection?.name||symbol};
      benchmarkSelection=null;
      saveBenchmarkSettings();
      showBenchmarkSuggestions([]);
      renderPortfolioBenchmark();
    });
    mainTab.addEventListener('click',()=>setActiveView('main'));
    chartTab.addEventListener('click',()=>setActiveView('chart'));
    portfolioTab.addEventListener('click',()=>setActiveView('portfolio'));
    document.querySelector('.app-tabs').addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      const tabs=[mainTab,chartTab,portfolioTab];
      const current=tabs.indexOf(document.activeElement);
      if(current<0)return;
      event.preventDefault();
      const next=event.key==='Home'?0:(event.key==='End'?tabs.length-1:(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length);
      tabs[next].focus();
      tabs[next].click();
      requestAnimationFrame(()=>tabs[next].focus());
    });
    portfolioAdd.addEventListener('click', openPortfolioDialog);
    portfolioCancel.addEventListener('click', () => portfolioDialog.close());
    portfolioSymbol.addEventListener('input',()=>{
      const requestId=++portfolioSearchRequestId;
      portfolioSelection=null;
      clearTimeout(portfolioSearchTimer);
      const query=portfolioSymbol.value.trim();
      if(query.length<2)return showPortfolioSuggestions([]);
      portfolioSearchTimer=setTimeout(async()=>{
        try{
          const payload=await cachedApiJson('/api/search?q='+encodeURIComponent(query),{ttl:60000});
          if(requestId!==portfolioSearchRequestId||portfolioSymbol.value.trim()!==query)return;
          showPortfolioSuggestions(payload.quotes||[]);
        }catch{if(requestId===portfolioSearchRequestId)showPortfolioSuggestions([])}
      },250);
    });
    portfolioSymbol.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!portfolioSuggestions.classList.contains('visible')){event.preventDefault();openPortfolioDialog()}
    });
    portfolioForm.addEventListener('submit', event => {
      event.preventDefault();
      const quantity = Number(portfolioQuantity.value);
      const unitCost = Number(portfolioCost.value);
      if (!portfolioSelection || !Number.isFinite(quantity) || quantity <= 0 || !Number.isFinite(unitCost) || unitCost < 0) return;
      const existing = portfolio.find(item => item.symbol === portfolioSelection.symbol);
      if (existing) {
        const totalQuantity = existing.quantity + quantity;
        existing.unitCost = totalQuantity > 0 ? (existing.quantity * existing.unitCost + quantity * unitCost) / totalQuantity : unitCost;
        existing.quantity = totalQuantity;
        existing.name = portfolioSelection.name || existing.name;
      } else {
        portfolio.push({ symbol:portfolioSelection.symbol, name:portfolioSelection.name, quantity, unitCost });
      }
      savePortfolio();
      portfolioDialog.close();
      portfolioSymbol.value = '';
      portfolioSelection = null;
      showPortfolioSuggestions([]);
      renderPortfolio();
    });
    applyTheme(localStorage.getItem(themeKey) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
    renderFavorites();
    updateFavoriteButton();
    updateCompareButton();
    loadPrice('AAPL');
    refreshMarketAndFavorites();
    renderAlarms();
    setInterval(checkAlarms,60000);
    setInterval(()=>{if(!document.hidden)refreshMarketAndFavorites()},15000);
    setInterval(refreshCurrentChart,15000);
    setInterval(()=>{if(!document.hidden&&portfolioView.classList.contains('active'))renderPortfolio()},15000);
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)return;
      if(mainView.classList.contains('active'))refreshMarketAndFavorites();
      if(chartView.classList.contains('active'))refreshCurrentChart();
      if(portfolioView.classList.contains('active'))renderPortfolio();
    });
  </script>

  <script>
    (function(){
      const mainTab=document.getElementById('mainTab');
      const chartTab=document.getElementById('chartTab');
      const portfolioTab=document.getElementById('portfolioTab');
      const navGroups={
        main:['desktopOverviewNav','mobileOverviewNav'],
        chart:['desktopChartNav','mobileChartNav'],
        portfolio:['desktopPortfolioNav','mobilePortfolioNav']
      };
      function resizeVisibleCharts(){
        requestAnimationFrame(function(){
          [typeof chart!=='undefined'?chart:null,typeof rsiChart!=='undefined'?rsiChart:null,typeof portfolioAllocationChart!=='undefined'?portfolioAllocationChart:null,typeof portfolioCurrencyChart!=='undefined'?portfolioCurrencyChart:null,typeof portfolioBenchmarkChart!=='undefined'?portfolioBenchmarkChart:null].forEach(function(item){if(item&&typeof item.resize==='function')item.resize()});
        });
      }
      function markNavigation(view){
        Object.entries(navGroups).forEach(function(entry){
          entry[1].forEach(function(id){const item=document.getElementById(id);if(item){const active=entry[0]===view;item.classList.toggle('is-active',active);if(active)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current')}});
        });
      }
      function openView(view){
        ({main:mainTab,chart:chartTab,portfolio:portfolioTab})[view].click();
        markNavigation(view);
        window.scrollTo({top:0,behavior:'smooth'});
        if(view!=='main')setTimeout(resizeVisibleCharts,60);
      }
      document.getElementById('desktopOverviewNav').addEventListener('click',function(){openView('main')});
      document.getElementById('desktopChartNav').addEventListener('click',function(){openView('chart')});
      document.getElementById('desktopPortfolioNav').addEventListener('click',function(){openView('portfolio')});
      document.getElementById('mobileOverviewNav').addEventListener('click',function(){openView('main')});
      document.getElementById('mobileChartNav').addEventListener('click',function(){openView('chart')});
      document.getElementById('mobilePortfolioNav').addEventListener('click',function(){openView('portfolio')});
      mainTab.addEventListener('click',function(){markNavigation('main')});
      chartTab.addEventListener('click',function(){markNavigation('chart');setTimeout(resizeVisibleCharts,40)});
      portfolioTab.addEventListener('click',function(){markNavigation('portfolio');setTimeout(resizeVisibleCharts,40)});
      document.getElementById('desktopAlarmNav').addEventListener('click',function(){openView('chart');document.getElementById('alarmButton').click()});
      document.getElementById('desktopDataNav').addEventListener('click',function(){document.getElementById('dataButton').click()});
      document.getElementById('mobileMoreNav').addEventListener('click',function(){document.getElementById('dataButton').click()});
      document.getElementById('favoritesList').addEventListener('click',function(event){if(event.target.closest('.favorite-card'))openView('chart')});
      document.getElementById('symbolForm').addEventListener('submit',function(){setTimeout(resizeVisibleCharts,40)});
    })();
  </script>
</body>
</html>
